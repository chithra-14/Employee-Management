
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000015;
        }

        h2 {
            text-align: center;
            color: #1e293b;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 12px;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Employee Management</h2>
        <p>Sign in to your account or register as a new user.</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <button type="submit">Login</button>
            <button type="button" id="showRegister">Register</button>
            <p id="message"></p>
        </form>
    </div>

    
<script>
    const loginForm = document.getElementById("loginForm");
    const API_URL = "https://employee-management-api-h0jc.onrender.com/api/auth";

    let mode = "login";

    function showMessage(text, success = false) {
        const message = document.getElementById("message");
        message.textContent = text;
        message.style.color = success ? "#16a34a" : "#dc2626";
    }

    function showLoginForm() {
        mode = "login";

        loginForm.innerHTML = `
            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <button type="submit">Login</button>
            <button type="button" id="showRegister">Register</button>
            <p id="message"></p>
        `;

        document.getElementById("showRegister")
            .addEventListener("click", showRegisterForm);
    }

    function showRegisterForm() {
        mode = "register";

        loginForm.innerHTML = `
            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" required>

            <label for="registerPassword">Password (minimum 8 characters)</label>
            <input type="password" id="registerPassword"
                   minlength="8" required>

            <button type="submit">Create Account</button>
            <button type="button" id="backToLogin">Back to Login</button>
            <p id="message"></p>
        `;

        document.getElementById("backToLogin")
            .addEventListener("click", showLoginForm);
    }

    document.getElementById("showRegister")
        .addEventListener("click", showRegisterForm);

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const submitButton = loginForm.querySelector(
            'button[type="submit"]'
        );

        submitButton.disabled = true;
        showMessage(mode === "login" ? "Logging in..." : "Registering...", true);

        try {
            let endpoint;
            let body;

            if (mode === "register") {
                endpoint = "/register";

                body = {
                    name: document.getElementById("name").value.trim(),
                    email: document.getElementById("registerEmail").value.trim(),
                    password: document.getElementById("registerPassword").value
                };
            } else {
                endpoint = "/login";

                body = {
                    email: document.getElementById("email").value.trim(),
                    password: document.getElementById("password").value
                };
            }

            const response = await fetch(API_URL + endpoint, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (!response.ok) {
                showMessage(data.message || "Something went wrong.");
                return;
            }

            if (mode === "register") {
                showLoginForm();
                showMessage(
                    "Registration successful! Please log in.",
                    true
                );
            } else {
                sessionStorage.setItem("authToken", data.token);
                sessionStorage.setItem(
                    "currentUser",
                    JSON.stringify(data.user)
                );

                showMessage("Login successful! Redirecting...", true);

                window.location.href = "index.html";
            }
        } catch (error) {
            console.error("Authentication error:", error);
            showMessage(
                "Cannot connect to the server. Check that your backend is running."
            );
        } finally {
            const button = loginForm.querySelector(
                'button[type="submit"]'
            );

            if (button) {
                button.disabled = false;
            }
        }
    });
</script>
</body>
</html>
